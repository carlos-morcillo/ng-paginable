<button
	class="hub-dropdown__toggle"
	[class.hub-dropdown__toggle--open]="isOpened()"
	type="button"
	[attr.aria-expanded]="isOpened()"
	(click)="toggle()"
>
	<ng-content select=".button"></ng-content>
</button>

<ng-template #dropdownContent>
	<ul class="hub-dropdown__menu" [class.hub-dropdown__menu--open]="isOpened()" [attr.aria-hidden]="!isOpened()">
		<ng-content select=".content"></ng-content>
	</ul>
</ng-template>
