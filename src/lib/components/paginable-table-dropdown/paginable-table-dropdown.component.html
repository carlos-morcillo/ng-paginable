<div class="hub-table-dropdown" [class.hub-table-dropdown--open]="shown">
	<button
		class="hub-table-dropdown__toggle"
		type="button"
		[ngClass]="buttonClass()"
		[style.color]="toggleColor()"
		[hubTableTooltip]="options().tooltip | unwrapAsync"
		[attr.aria-expanded]="shown"
		(click)="toggle(); $event.stopPropagation()"
		[disabled]="disabled()"
	>
		<div class="hub-table-dropdown__toggle-content">
			<i class="hub-table-dropdown__icon" [ngClass]="options().icon || 'hub-table-dropdown__icon--ellipsis-v'"></i>
			@if (options().title) {
				<span class="hub-table-dropdown__title">{{ options().title | unwrapAsync }}</span>
			}
		</div>
	</button>
	<ng-template #dropdownTpt>
		<div
			class="hub-table-dropdown__menu hub-table-dropdown__menu--{{ options().position }}"
			[class.hub-table-dropdown__menu--open]="shown"
			[style]="{
				right: options().position == 'end' || options().position === 'right' ? 0 : 'initial'
			}"
		>
			@for (dropdownItem of options().buttons; track dropdownItem) {
				@if (!(isItemHidden(dropdownItem, row()) | async)) {
					<button
						class="hub-table-dropdown__item"
						type="button"
						[disabled]="(isItemDisabled(dropdownItem, row()) | async) ?? false"
						[hubTableTooltip]="dropdownItem.title | unwrapAsync"
						[ngClass]="getDropdownItemClassList(dropdownItem)"
						(click)="executeDropdownAction(dropdownItem)"
					>
						<div class="hub-table-dropdown__item-content">
							<ng-hub-ui-icon class="hub-table-dropdown__item-icon" [config]="dropdownItem.icon"></ng-hub-ui-icon>
							@if (dropdownItem.label) {
								<span class="hub-table-dropdown__item-label">{{ dropdownItem.label | unwrapAsync }}</span>
							}
						</div>
					</button>
				}
			}
		</div>
	</ng-template>
</div>
