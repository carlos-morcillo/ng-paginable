<div class="range-input">
	<div class="range-input__field">
		@if (type() == 'date') {
			<label class="range-input__label">{{ 'FROM' | translate | ucfirst }}:</label>
		}
		<input
			class="range-input__control"
			[type]="type()"
			[(ngModel)]="value[0]"
			[placeholder]="'FROM' | translate | ucfirst"
			(change)="onChange($any(value))"
		/>
	</div>
	<div class="range-input__field">
		@if (type() == 'date') {
			<label class="range-input__label">{{ 'TO' | translate | ucfirst }}:</label>
		}
		<input
			class="range-input__control"
			[type]="type()"
			[(ngModel)]="value[1]"
			[placeholder]="'TO' | translate | ucfirst"
			(change)="onChange($any(value))"
		/>
	</div>
</div>
